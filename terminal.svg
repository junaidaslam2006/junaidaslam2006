<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F4739"/>
      <stop offset="60%" stop-color="#1E2B24"/>
      <stop offset="100%" stop-color="#16211C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A3C572"/>
      <stop offset="55%" stop-color="#F0C87A"/>
      <stop offset="100%" stop-color="#B7A9C9"/>
    </linearGradient>
    <style>
      .l { opacity: 0; animation: in .45s ease-out forwards; }
      @keyframes in { from { opacity:0; transform: translateX(-6px);} to { opacity:1; transform:none;} }
      .cur { animation: bl 1s steps(1) infinite 4.6s; opacity:0; }
      @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .fill { animation: grow 1.1s cubic-bezier(.2,.8,.3,1) forwards 3.5s; width:0; }
      @keyframes grow { to { width: 250px; } }
      text { font-size: 15px; }
      .t  { fill:#6E8272; }
      .d  { fill:#EDE6D6; }
      .k  { fill:#A3C572; }
      .a  { fill:#F0C87A; }
      .v  { fill:#B7A9C9; }
    </style>
  </defs>

  <rect width="900" height="430" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="429" rx="14" fill="none" stroke="#2F4739"/>

  <circle cx="26" cy="26" r="5.5" fill="#D98E7A"/>
  <circle cx="46" cy="26" r="5.5" fill="#F0C87A"/>
  <circle cx="66" cy="26" r="5.5" fill="#A3C572"/>
  <text x="96" y="31" class="t" font-size="13">junaid@epoch — tail -f /var/log/junaid.log</text>
  <line x1="0" y1="50" x2="900" y2="50" stroke="#2F4739"/>

  <g>
    <text x="30" y="90"  class="l" style="animation-delay:.1s"><tspan class="a">$</tspan> <tspan class="d">tail -f /var/log/junaid.log</tspan></text>

    <text x="30" y="128" class="l" style="animation-delay:.5s"><tspan class="t">[00:00:00]</tspan> <tspan class="d">boot</tspan> <tspan class="t">.............................</tspan> <tspan class="k">ok</tspan></text>
    <text x="30" y="154" class="l" style="animation-delay:.8s"><tspan class="t">[00:00:01]</tspan> <tspan class="d">languages</tspan> <tspan class="t">......</tspan> <tspan class="v">پښتو · English · اردو · py</tspan></text>
    <text x="30" y="180" class="l" style="animation-delay:1.1s"><tspan class="t">[00:00:02]</tspan> <tspan class="d">modules</tspan> <tspan class="t">...</tspan> <tspan class="v">ml · dl · nlp · vision · genai · agents</tspan></text>
    <text x="30" y="206" class="l" style="animation-delay:1.5s"><tspan class="t">[00:00:03]</tspan> <tspan class="d">scanning for Pashto language models</tspan> <tspan class="t">.......</tspan></text>
    <text x="30" y="232" class="l" style="animation-delay:1.9s"><tspan class="t">[00:00:26]</tspan> <tspan class="d">scanning</tspan> <tspan class="t">..................................</tspan></text>
    <text x="30" y="258" class="l" style="animation-delay:2.3s"><tspan class="t">[00:00:41]</tspan> <tspan class="d">results:</tspan> <tspan class="a">0</tspan></text>
    <text x="30" y="284" class="l" style="animation-delay:2.6s"><tspan class="t">[00:00:41]</tspan> <tspan class="d">40,000,000 speakers. zero models.</tspan></text>
    <text x="30" y="310" class="l" style="animation-delay:2.9s"><tspan class="t">[00:00:42]</tspan> <tspan fill="#D98E7A">EXCEPTION</tspan> <tspan class="t">→</tspan> <tspan class="d">UnacceptableError</tspan></text>
    <text x="30" y="336" class="l" style="animation-delay:3.2s"><tspan class="t">[00:00:42]</tspan> <tspan class="d">handler</tspan> <tspan class="t">→</tspan> <tspan class="k">build it yourself</tspan></text>

    <g class="l" style="animation-delay:3.5s">
      <text x="30" y="368" class="t">[00:00:43]</text>
      <rect x="132" y="356" width="250" height="14" rx="7" fill="#16211C" stroke="#2F4739"/>
      <rect x="132" y="356" height="14" rx="7" fill="url(#bar)" class="fill"/>
      <text x="398" y="368" class="a" font-weight="700">100%</text>
      <text x="452" y="368" class="k" font-weight="700">🇵🇰 FIRST PASHTO LLM</text>
    </g>

    <text x="30" y="400" class="l" style="animation-delay:4.4s"><tspan class="t">[00:00:44]</tspan> <tspan class="d">process did not exit. it never does.</tspan><tspan class="cur" fill="#A3C572"> ▌</tspan></text>
  </g>
</svg>

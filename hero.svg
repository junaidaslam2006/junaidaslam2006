<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22322A"/><stop offset="100%" stop-color="#16211C"/>
    </linearGradient>

    <!-- typewriter reveals -->
    <clipPath id="tw1"><rect x="44" y="30" height="26" width="0">
      <animate attributeName="width" from="0" to="620" dur="1.5s" begin="0.2s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="tw2"><rect x="44" y="286" height="26" width="0">
      <animate attributeName="width" from="0" to="700" dur="1.6s" begin="5.6s" fill="freeze"/>
    </rect></clipPath>

    <style>
      text { fill:#EDE6D6; font-size:14px; }
      .dim   { fill:#6E8272; }
      .sage  { fill:#A3C572; }
      .gold  { fill:#F0C87A; }
      .lav   { fill:#B7A9C9; }

      @keyframes emit { 0% { opacity:0; transform: translateY(7px) } 60% { opacity:1 } 100% { opacity:1; transform:none } }
      @keyframes hot  { 0% { fill:#F0C87A } 100% { fill:#EDE6D6 } }
      @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes bar  { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes swap { 0%,28%{opacity:1} 33%,100%{opacity:0} }
      @keyframes swap2{ 0%,30%{opacity:0} 35%,63%{opacity:1} 68%,100%{opacity:0} }
      @keyframes swap3{ 0%,65%{opacity:0} 70%,100%{opacity:1} }

      .glyph { opacity:0; animation: emit .35s ease-out forwards; }
      .chip  { opacity:0; animation: emit .3s ease-out forwards; }
      .chiptxt { animation: hot 1.4s ease-out forwards; }
      .caret { animation: blink 1s steps(1) infinite; }
      .b { transform-box: fill-box; transform-origin:left center; transform: scaleX(0);
           animation: bar .5s cubic-bezier(.2,.9,.3,1) forwards; }
      .s1 { animation: swap 9s ease-in-out infinite; }
      .s2 { animation: swap2 9s ease-in-out infinite; }
      .s3 { animation: swap3 9s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#card)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#2F4739"/>
  <line x1="790" y1="24" x2="790" y2="336" stroke="#2F4739"/>

  <!-- ── left: the decode ── -->
  <g clip-path="url(#tw1)">
    <text x="44" y="48"><tspan class="gold">›</tspan> <tspan class="dim">junaid.generate(</tspan><tspan class="lav">self</tspan><tspan class="dim">, temperature=</tspan><tspan class="sage">1.2</tspan><tspan class="dim">)</tspan></text>
  </g>

  <!-- name, glyph by glyph -->
  <g font-size="74" font-weight="800" letter-spacing="10" fill="#FFFAEF">
    <text class="glyph" x="44"  y="140" style="animation-delay:1.9s">J</text>
    <text class="glyph" x="108" y="140" style="animation-delay:2.02s">U</text>
    <text class="glyph" x="176" y="140" style="animation-delay:2.14s">N</text>
    <text class="glyph" x="246" y="140" style="animation-delay:2.26s">A</text>
    <text class="glyph" x="314" y="140" style="animation-delay:2.38s">I</text>
    <text class="glyph" x="356" y="140" style="animation-delay:2.5s">D</text>
    <text class="caret" x="428" y="140" fill="#A3C572">▌</text>
  </g>

  <!-- token chips -->
  <g font-size="12.5">
    <g class="chip" style="animation-delay:2.9s">
      <rect x="44" y="172" width="118" height="26" rx="5" fill="#1B2C22" stroke="#3C5C46"/>
      <text class="chiptxt" x="58" y="189" style="animation-delay:2.9s">AI ENGINEER</text>
    </g>
    <g class="chip" style="animation-delay:3.15s">
      <rect x="170" y="172" width="152" height="26" rx="5" fill="#1B2C22" stroke="#3C5C46"/>
      <text class="chiptxt" x="184" y="189" style="animation-delay:3.15s">LOW-RESOURCE NLP</text>
    </g>
    <g class="chip" style="animation-delay:3.4s">
      <rect x="330" y="172" width="74" height="26" rx="5" fill="#1B2C22" stroke="#3C5C46"/>
      <text class="chiptxt" x="344" y="189" style="animation-delay:3.4s">AGENTS</text>
    </g>
    <g class="chip" style="animation-delay:3.65s">
      <rect x="412" y="172" width="102" height="26" rx="5" fill="#1B2C22" stroke="#3C5C46"/>
      <text class="chiptxt" x="426" y="189" style="animation-delay:3.65s">OPEN SOURCE</text>
    </g>
    <g class="chip" style="animation-delay:3.9s">
      <rect x="44" y="206" width="248" height="26" rx="5" fill="#2A3D2C" stroke="#6E9A54"/>
      <text class="chiptxt" x="58" y="223" style="animation-delay:3.9s">🇵🇰 PAKISTAN'S FIRST PASHTO LLM</text>
    </g>
  </g>

  <line x1="44" y1="258" x2="746" y2="258" stroke="#2F4739"/>

  <g clip-path="url(#tw2)">
    <text x="44" y="304" font-size="16" class="sage">زه ژبه ژوندۍ ساتم<tspan class="dim" font-size="12">   // i keep the language alive</tspan></text>
  </g>

  <!-- ── right: logits panel ── -->
  <text x="822" y="48" class="dim" font-size="11" letter-spacing="2">NEXT-TOKEN DISTRIBUTION</text>
  <line x1="822" y1="60" x2="1156" y2="60" stroke="#2F4739"/>

  <!-- state 1 -->
  <g class="s1" font-size="12">
    <text x="822" y="88" class="dim">context: "a language with 40M speakers"</text>
    <text x="822" y="122" class="gold">▁deserves</text>
    <rect x="960" y="112" width="176" height="9" rx="4.5" fill="#F0C87A" class="b" style="animation-delay:.2s"/>
    <text x="1142" y="122" class="dim" font-size="10">.91</text>
    <text x="822" y="150" class="dim">▁lacks</text>
    <rect x="960" y="140" width="38" height="9" rx="4.5" fill="#3C5C46" class="b" style="animation-delay:.3s"/>
    <text x="1142" y="150" class="dim" font-size="10">.06</text>
    <text x="822" y="178" class="dim">▁waits</text>
    <rect x="960" y="168" width="14" height="9" rx="4.5" fill="#3C5C46" class="b" style="animation-delay:.4s"/>
    <text x="1142" y="178" class="dim" font-size="10">.02</text>
  </g>

  <!-- state 2 -->
  <g class="s2" font-size="12">
    <text x="822" y="88" class="dim">context: "open models for Pashto:"</text>
    <text x="822" y="122" class="gold">▁zero</text>
    <rect x="960" y="112" width="182" height="9" rx="4.5" fill="#D98E7A"/>
    <text x="1142" y="122" class="dim" font-size="10">.97</text>
    <text x="822" y="150" class="dim">▁several</text>
    <rect x="960" y="140" width="12" height="9" rx="4.5" fill="#3C5C46"/>
    <text x="1142" y="150" class="dim" font-size="10">.02</text>
    <text x="822" y="178" class="dim">▁many</text>
    <rect x="960" y="168" width="6" height="9" rx="4.5" fill="#3C5C46"/>
    <text x="1142" y="178" class="dim" font-size="10">.01</text>
  </g>

  <!-- state 3 -->
  <g class="s3" font-size="12">
    <text x="822" y="88" class="dim">context: "so somebody should"</text>
    <text x="822" y="122" class="sage">▁build_it</text>
    <rect x="960" y="112" width="186" height="9" rx="4.5" fill="#A3C572"/>
    <text x="1142" y="122" class="dim" font-size="10">.99</text>
    <text x="822" y="150" class="dim">▁complain</text>
    <rect x="960" y="140" width="8" height="9" rx="4.5" fill="#3C5C46"/>
    <text x="1142" y="150" class="dim" font-size="10">.01</text>
    <text x="822" y="178" class="dim">▁wait</text>
    <rect x="960" y="168" width="4" height="9" rx="4.5" fill="#3C5C46"/>
    <text x="1142" y="178" class="dim" font-size="10">.00</text>
  </g>

  <line x1="822" y1="212" x2="1156" y2="212" stroke="#2F4739"/>
  <text x="822" y="240" class="dim" font-size="11">eos_token</text>
  <text x="1092" y="240" class="gold" font-size="11">never emitted</text>
  <text x="822" y="266" class="dim" font-size="11">stop_reason</text>
  <text x="1108" y="266" class="sage" font-size="11">none. still</text>
  <text x="822" y="292" class="dim" font-size="11">seed</text>
  <text x="1074" y="292" class="lav" font-size="11">پښتو · 40,000,000</text>
  <text x="822" y="318" class="dim" font-size="11">state</text>
  <text x="1080" y="318" class="sage" font-size="11">decoding<tspan class="caret">▌</tspan></text>
</svg>
